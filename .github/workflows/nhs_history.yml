name: Weekly NHS history

on:
  schedule:
    - cron: "0 3 * * 0"   # Sundays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Download rolling 30-day history
        run: python collectors/nhs_history.py
        env:
          AE_USER_AGENT: ${{ vars.AE_USER_AGENT }}

      - name: Commit history files
        run: |
          git config user.name "ca2-collector"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nhs/history_raw
          git diff --cached --quiet || git commit -m "data: weekly NHS history $(date -u +%Y-%m-%d)"
          git pull --rebase || true
          git push
