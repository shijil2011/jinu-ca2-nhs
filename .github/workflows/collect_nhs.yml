name: Collect NHS A&E

on:
  schedule:
    # GitHub cron can be delayed or skipped; cron-job.org also triggers this via workflow_dispatch.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Collect NHS A&E snapshot
        run: python collectors/nhs_collect.py
        env:
          AE_USER_AGENT: ${{ vars.AE_USER_AGENT }}

      - name: Commit and push snapshot
        run: |
          git config user.name "ca2-collector"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nhs/readings_csv logs/nhs_collection_log.csv
          git diff --cached --quiet || git commit -m "data: nhs $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase || true
          git push
